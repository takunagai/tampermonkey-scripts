name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # @version の上げ忘れ検査で比較元コミットを参照する
          fetch-depth: 0
          persist-credentials: false

      # mise.toml の Node / pnpm を入れる
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

      - name: dist/ がソースから再生成したものと一致するか
        run: |
          git diff --exit-code -- dist
          test -z "$(git status --porcelain -- dist)"

      - name: 配布物のポリシー検査
        run: node tools/check-dist.ts --base "$BASE_REF"
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
